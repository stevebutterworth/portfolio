profile: >
  Product engineer and tech lead specialising in data-heavy products, with
  20+ years taking raw data from ingestion to the screen a customer uses. Built OLAP and
  analytics SDKs at Crystal Decisions and i2, live sports data systems for
  NTT DATA fed by GPS, timing and scoring feeds over Kafka and WebSockets,
  search alerts that have sent millions of emails, and LLM classification
  pipelines in production. More than 20 applications shipped to production
  for long-standing clients along the way.

  Tech lead: led small engineering teams to immovable live-event deadlines,
  setting coding standards and reviewing every pull request.
  Product-focused: founded two products, and own work from the first
  customer conversation to long-term production.
  Test-first: coding agents now write most of my code, under guardrails I
  built for test-first development, code review, and security and performance
  audits. That leaves my time for architecture, reliability and tech debt: I
  kept one platform healthy for 13 years, from Rails 1 to Rails 8.

